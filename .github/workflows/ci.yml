name: CI

on:
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install and check
        shell: bash
        run: |
          echo "::group::Install dependencies"
          npm ci
          echo "::endgroup::"

          echo "::group::Run checks"
          npm run check
          echo "::endgroup::"

          echo "::group::Verify package"
          npm pack --dry-run
          node dist/cli.js --version
          echo "::endgroup::"
